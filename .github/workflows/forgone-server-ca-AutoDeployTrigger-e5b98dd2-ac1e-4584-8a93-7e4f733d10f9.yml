name: Trigger auto deployment for forgone-server-ca

# When this action will be executed
on:
  # Automatically trigger it when detected changes in repo
  push:
    branches: 
      [ main ]
    paths:
    - '**'
    - '.github/workflows/forgone-server-ca-AutoDeployTrigger-e5b98dd2-ac1e-4584-8a93-7e4f733d10f9.yml'

  # Allow manual trigger 
  workflow_dispatch:      

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions: 
      id-token: write #This is required for requesting the OIDC JWT Token
      contents: read #Required when GH token is used to authenticate with private repo

    steps:
      - name: Checkout to the branch
        uses: actions/checkout@v2

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.FORGONESERVERCA_AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.FORGONESERVERCA_AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.FORGONESERVERCA_AZURE_SUBSCRIPTION_ID }}

      - name: Build and push container image to registry
        uses: azure/container-apps-deploy-action@v2
        with:
          appSourcePath: ${{ github.workspace }}
          _dockerfilePathKey_: _dockerfilePath_
          _targetLabelKey_: _targetLabel_
          registryUrl: 
          registryUsername: ${{ secrets.FORGONESERVERCA_REGISTRY_USERNAME }}
          registryPassword: ${{ secrets.FORGONESERVERCA_REGISTRY_PASSWORD }}
          containerAppName: forgone-server-ca
          resourceGroup: rg-forgeone-ai
          imageToBuild: default/[parameters('containerAppName')]:${{ github.sha }}
          _buildArgumentsKey_: |
            _buildArgumentsValues_


