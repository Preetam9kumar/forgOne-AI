name: Deploy ForgeOne AI to Azure Cloud

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  test-and-build:
    name: Run Tests & Build Assets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Backend Dependencies & Run Pytest
        run: |
          cd backend
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pytest -v

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Frontend Dependencies & Build
        run: |
          cd frontend
          npm ci
          npm run build

  deploy-container-app:
    name: Deploy Backend to Azure Container Apps
    needs: test-and-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Log in to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Build & Push Backend Container Image
        run: |
          az acr build \
            --registry ${{ secrets.AZURE_ACR_NAME }} \
            --image forgeone-backend:${{ github.sha }} \
            backend/

      - name: Deploy to Azure Container App
        uses: azure/container-apps-deploy-action@v2
        with:
          appSourcePath: ${{ github.workspace }}/backend
          acrName: ${{ secrets.AZURE_ACR_NAME }}
          containerAppName: forgeone-backend
          resourceGroup: ${{ secrets.AZURE_RESOURCE_GROUP }}
          imageToDeploy: ${{ secrets.AZURE_ACR_NAME }}.azurecr.io/forgeone-backend:${{ github.sha }}
